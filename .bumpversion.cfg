[bumpversion]
current_version = 5.7.0.dev0
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\.(?P<release>[a-z]+)(?P<dev>\d+))?
serialize = 
	{major}.{minor}.{patch}.{release}{dev}
	{major}.{minor}.{patch}
commit = False
tag = False
tag_name = {new_version}
message = Bump version to {new_version}

[bumpversion:part:release]
optional_value = release
values = 
	dev
	release

[bumpversion:part:dev]

[bumpversion:file:VERSION]

[bumpversion:file(cargo):crates/ngw-mvt/Cargo.toml]
serialize = 
	{major}.{minor}.{patch}-{release}.{dev}
	{major}.{minor}.{patch}
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file(cargo):crates/ngw-mvt/Cargo.lock]
serialize = 
	{major}.{minor}.{patch}-{release}.{dev}
	{major}.{minor}.{patch}
search = name = "nextgisweb-mvt"
	version = "{current_version}"
replace = name = "nextgisweb-mvt"
	version = "{new_version}"
