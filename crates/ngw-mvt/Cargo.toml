[package]
name = "nextgisweb-mvt"
version = "5.7.0-dev.0"
edition = "2024"
license = "GPL-3.0-only"

[lib]
name = "ngw_mvt"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py312"] }
mlt-core = "0.22.0"
geo-types = "0.7.19"
map-tile-toolkit = "0.3.4"

[profile.release]
lto = "thin"
codegen-units = 1
