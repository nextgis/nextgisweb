[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "nextgisweb-mvt"
dynamic = ["version"]
description = "Native MVT encoder for NextGIS Web"
requires-python = ">=3.12"
license = "GPL-3.0-only"

[tool.maturin]
module-name = "ngw_mvt"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
