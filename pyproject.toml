[tool.ruff]
line-length = 99
exclude = ["nextgisweb/raster_layer/validate_cog.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "C4", "RUF022"]
ignore = ["E501", "E731", "UP030", "UP031", "UP032"]

[tool.ruff.lint.per-file-ignores]
"**/test/*.py" = ["ANN"]
"./docker.py" = ["ANN"]
"./setup.py" = ["ANN"]
"./nextgisweb/__init__.py" = ["ANN"]
"./nextgisweb/script.py" = ["ANN"]
# TODO: Fix issues and remove ignores step by step
